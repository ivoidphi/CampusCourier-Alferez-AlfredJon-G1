{% extends "base.html" %}

{% block title %}Student Profile | CampusCourier{% endblock %}

{% block content %}
    <h1>Student Profile</h1>
    <p>Student ID: {{ user.student_id }}</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save profile</button>
    </form>
{% endblock %}
